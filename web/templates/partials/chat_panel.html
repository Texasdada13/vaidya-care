<!-- AI Chat Floating Button -->
<button class="chat-fab" onclick="toggleChat()" title="AI Assistant">
    <i class="bi bi-stars"></i>
    <span class="chat-fab-label">AI Assistant</span>
</button>

<!-- Chat Panel -->
<div class="chat-panel" id="chatPanel">
    <div class="chat-header">
        <div style="display:flex;align-items:center;gap:0.65rem;">
            <div class="chat-header-icon">
                <i class="bi bi-chat-dots-fill" style="font-size:1rem;"></i>
            </div>
            <div>
                <div style="font-weight:700;font-size:1rem;">AI Assistant</div>
                <div style="font-size:0.75rem;opacity:0.75;">Ask about patients, plans &amp; Ayurveda</div>
            </div>
        </div>
        <div style="display:flex;gap:4px;">
            <button class="chat-close-btn" onclick="toggleChat()"><i class="bi bi-x-lg"></i></button>
        </div>
    </div>

    <div class="chat-suggestions" id="chatSuggestions"></div>

    <div class="chat-messages" id="chatMessages">
        <div class="chat-msg assistant">
            <div class="chat-msg-avatar"><i class="bi bi-flower1"></i></div>
            <div class="chat-msg-body">
                <div class="chat-msg-content">
                    Namaste! I'm your Vaidya Care assistant. I can help you review patient check-ins, plan follow-ups, and answer questions about Ayurvedic protocols. What would you like to know?
                </div>
            </div>
        </div>
    </div>

    <div class="chat-input-area">
        <form id="chatForm" onsubmit="sendChatMessage(event)">
            <div style="display:flex;gap:0.5rem;">
                <input type="text" id="chatInput" placeholder="Ask about your patients..."
                       autocomplete="off" style="flex:1;">
                <button type="submit" class="chat-send-btn" id="chatSendBtn">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
const CHAT_PATIENT_ID = typeof PATIENT_ID !== 'undefined' ? PATIENT_ID : null;
let chatSessionId = 'session-' + Date.now();

function toggleChat() {
    const panel = document.getElementById('chatPanel');
    const fab   = document.querySelector('.chat-fab');
    const sidebarBtn = document.getElementById('sidebarAiBtn');
    panel.classList.toggle('open');
    if (fab) fab.classList.toggle('hidden');
    const isOpen = panel.classList.contains('open');
    if (sidebarBtn) sidebarBtn.classList.toggle('active', isOpen);
    if (isOpen) {
        document.getElementById('chatInput').focus();
        loadSuggestions();
    }
}

function loadSuggestions() {
    const url = CHAT_PATIENT_ID
        ? `/api/chat/suggestions?patient_id=${CHAT_PATIENT_ID}`
        : '/api/chat/suggestions';
    fetch(url).then(r => r.json()).then(data => {
        const c = document.getElementById('chatSuggestions');
        if (data.suggestions && data.suggestions.length) {
            c.innerHTML = data.suggestions.map(s =>
                `<button class="chat-suggestion-btn" onclick="useSuggestion(this)">${s}</button>`
            ).join('');
            c.style.display = 'flex';
        }
    }).catch(() => {});
}

function useSuggestion(btn) {
    document.getElementById('chatInput').value = btn.textContent;
    document.getElementById('chatSuggestions').style.display = 'none';
    document.getElementById('chatForm').requestSubmit();
}

function sendChatMessage(e) {
    e.preventDefault();
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    if (!message) return;

    document.getElementById('chatSuggestions').style.display = 'none';
    appendMessage('user', message);
    input.value = '';

    const sendBtn = document.getElementById('chatSendBtn');
    input.disabled = true;
    sendBtn.disabled = true;

    const assistantMsg = appendMessage('assistant', '', true);
    const contentEl = assistantMsg.querySelector('.chat-msg-content');

    fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            message,
            patient_id: CHAT_PATIENT_ID,
            session_id: chatSessionId,
        }),
    }).then(response => {
        if (!response.ok) {
            return response.json().then(err => {
                contentEl.textContent = err.error || 'Something went wrong.';
                contentEl.style.color = 'var(--danger)';
                throw new Error(err.error);
            });
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        function read() {
            reader.read().then(({done, value}) => {
                if (done) { input.disabled = false; sendBtn.disabled = false; input.focus(); return; }
                buffer += decoder.decode(value, {stream: true});
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.text) { contentEl.textContent += data.text; scrollChat(); }
                            if (data.done) {
                                input.disabled = false; sendBtn.disabled = false; input.focus();
                                formatContent(contentEl); return;
                            }
                            if (data.error) {
                                contentEl.textContent = 'Error: ' + data.error;
                                contentEl.style.color = 'var(--danger)';
                                input.disabled = false; sendBtn.disabled = false; return;
                            }
                        } catch(e) {}
                    }
                }
                read();
            });
        }
        read();
    }).catch(err => {
        if (!contentEl.textContent) {
            contentEl.textContent = 'Failed to connect. Make sure ANTHROPIC_API_KEY is set.';
            contentEl.style.color = 'var(--danger)';
        }
        input.disabled = false; sendBtn.disabled = false;
    });
}

function appendMessage(role, content, streaming = false) {
    const messages = document.getElementById('chatMessages');
    const msg = document.createElement('div');
    msg.className = `chat-msg ${role}`;
    msg.innerHTML = `
        <div class="chat-msg-avatar">
            ${role === 'user' ? '<i class="bi bi-person-fill"></i>' : '<i class="bi bi-flower1"></i>'}
        </div>
        <div class="chat-msg-body">
            <div class="chat-msg-content">${streaming ? '<span class="chat-typing"></span>' : escapeHtml(content)}</div>
        </div>`;
    messages.appendChild(msg);
    scrollChat();
    return msg;
}

function scrollChat() { const m = document.getElementById('chatMessages'); m.scrollTop = m.scrollHeight; }
function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
function formatContent(el) {
    let html = escapeHtml(el.textContent);
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
    el.innerHTML = html;
}
</script>
