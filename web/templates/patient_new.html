{% extends 'base.html' %}
{% block title %}New Patient — Vaidya Care{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <a href="{{ url_for('patients') }}" style="font-size:0.82rem;color:var(--text-secondary);text-decoration:none;">← Patients</a>
        <h1>New Patient</h1>
    </div>
</div>

<form method="POST" style="max-width:720px;">
    <div class="card" style="margin-bottom:1rem;">
        <h2 style="font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary);margin-bottom:1rem;">Contact Details</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group"><label>First Name *</label><input type="text" name="first_name" required></div>
            <div class="form-group"><label>Last Name *</label><input type="text" name="last_name" required></div>
            <div class="form-group"><label>Email</label><input type="email" name="email"></div>
            <div class="form-group"><label>Phone</label><input type="tel" name="phone"></div>
            <div class="form-group"><label>Date of Birth</label><input type="date" name="dob"></div>
            <div class="form-group">
                <label>Sex</label>
                <select name="sex" style="width:100%;padding:0.6rem;border:1px solid var(--border);border-radius:8px;">
                    <option value="">Select</option>
                    <option>Male</option><option>Female</option><option>Other</option>
                </select>
            </div>
            <div class="form-group" style="grid-column:1/-1;"><label>Location (City, State)</label><input type="text" name="location" placeholder="e.g. Ocala, Florida"></div>
            <div class="form-group" style="grid-column:1/-1;"><label>Occupation</label><input type="text" name="occupation"></div>
        </div>
    </div>

    <div class="card" style="margin-bottom:1rem;">
        <h2 style="font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary);margin-bottom:1rem;">Lifestyle</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group" style="grid-column:1/-1;">
                <label>Exercise Routine</label>
                <textarea name="exercise_notes" rows="2" placeholder="e.g. Weight lifting 4x/week, limited cardio"></textarea>
            </div>
            <div class="form-group" style="grid-column:1/-1;">
                <label>Diet Pattern</label>
                <textarea name="diet_pattern" rows="2" placeholder="e.g. Primarily non-vegetarian, inconsistent meal timing"></textarea>
            </div>
            <div class="form-group"><label>Alcohol</label><input type="text" name="alcohol_notes" placeholder="e.g. Twice/month"></div>
            <div class="form-group"><label>Caffeine / Nicotine</label><input type="text" name="caffeine_notes" placeholder="e.g. Occasional during heavy work"></div>
        </div>
    </div>

    <div style="display:flex;gap:1rem;justify-content:flex-end;">
        <a href="{{ url_for('patients') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Patient</button>
    </div>
</form>
{% endblock %}
